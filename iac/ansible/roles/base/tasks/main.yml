---
- name: Create teacher user
  ansible.builtin.user:
    name: teacher
    groups: sudo
    shell: /bin/bash
    create_home: true
    password: "{{ '12345678' | password_hash('sha512') }}"
    update_password: on_create

- name: Create student user
  ansible.builtin.user:
    name: student
    shell: /bin/bash
    create_home: true

- name: Create gradebook file
  ansible.builtin.copy:
    dest: /home/student/gradebook
    content: "20\n"
    owner: student
    group: student
    mode: '0644'

- name: Allow teacher sudo with password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/teacher
    content: "teacher ALL=(ALL) ALL\n"
    mode: '0440'